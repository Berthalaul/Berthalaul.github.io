<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y2K Dream Laptop</title>

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    font-family:Verdana,sans-serif;

    background:
    linear-gradient(
        135deg,
        #c7ecff,
        #ffd7ef,
        #fff0f8
    );
}

/* ===== FLOWERS ===== */

.flower{
    position:absolute;
    width:140px;
    height:140px;
    z-index:1;
    animation:float 10s infinite ease-in-out;
}

.flower::before,
.flower::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #ffffff 0%,
        #ffb6e8 45%,
        #ff4fc4 80%
    );
}

.flower::before{
    transform:rotate(45deg) scale(.65);
}

.flower::after{
    transform:rotate(-45deg) scale(.65);
}

.flower span{
    position:absolute;
    width:30px;
    height:30px;
    background:white;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    box-shadow:
    0 0 20px white,
    0 0 40px #ff99dd;
}

@keyframes float{

    0%{
        transform:
        translateY(0px)
        rotate(0deg);
    }

    50%{
        transform:
        translateY(-40px)
        rotate(10deg);
    }

    100%{
        transform:
        translateY(0px)
        rotate(0deg);
    }
}

/* ===== SPARKLES ===== */

.sparkle{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;

    box-shadow:
    0 0 10px white,
    0 0 20px #ffb6ea,
    0 0 40px #8fd7ff;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        transform:scale(.5);
        opacity:.3;
    }

    to{
        transform:scale(2);
        opacity:1;
    }
}

/* ===== COMPUTER ===== */

#computer{
    position:absolute;
    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    width:760px;
    height:600px;

    z-index:100;
}

/* shell */

#shell{
    position:absolute;
    inset:0;

    border-radius:45px;

    background:
    linear-gradient(
        to bottom,
        white,
        #f3f3f3
    );

    border:12px solid #ff43b0;

    box-shadow:
    0 0 60px #ffb6ea,
    0 0 120px #8fd7ff;
}

/* title */

#logo{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    font-size:30px;
    font-weight:bold;

    color:#666;
}

/* POWER BUTTON */

#powerButton{
    position:absolute;

    top:18px;
    right:25px;

    width:34px;
    height:34px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ff7ed2,
        #ff2fa5
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    z-index:999;

    box-shadow:
    0 0 15px #ffb6ea,
    0 0 30px #8fd7ff;

    transition:.3s;
}

#powerButton:hover{
    transform:scale(1.1);
}

/* screen */

#screen{
    position:absolute;

    top:70px;
    left:75px;

    width:610px;
    height:340px;

    border-radius:18px;

    border:8px solid #ddd;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #ffc9eb,
        #ff9fd8
    );

    box-shadow:
    inset 0 0 40px white;

    transition:.5s;
}

/* desktop */

#desktop{
    width:100%;
    height:100%;
    position:relative;
}

/* desktop icons */

.desktopIcon{
    width:90px;
    position:absolute;
    text-align:center;
    color:white;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.desktopIcon img{
    width:64px;
    height:64px;
    object-fit:cover;

    border-radius:18px;

    background:white;

    padding:5px;

    box-shadow:
    0 0 20px white,
    0 0 30px #ffb6ea;

    transition:.3s;
}

.desktopIcon:hover img{
    transform:scale(1.1);
}

/* windows */

.window{
    position:absolute;

    top:20px;
    left:20px;

    width:560px;
    height:280px;

    border-radius:20px;

    background:white;

    display:none;

    overflow:hidden;

    box-shadow:
    0 0 40px rgba(0,0,0,.3);

    animation:pop .3s ease;
}

@keyframes pop{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

/* top bar */

.topbar{
    height:45px;

    background:
    linear-gradient(
        to right,
        #ff7ed2,
        #ffb7e8
    );

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    color:white;
    font-weight:bold;
}

/* close */

.close{
    background:white;
    color:#ff43b0;

    border:none;

    width:28px;
    height:28px;

    border-radius:50%;

    cursor:pointer;

    font-weight:bold;
}

/* content */

.content{
    padding:20px;
    height:calc(100% - 45px);
    overflow:auto;
    color:#444;
}

/* keyboard */

#base{
    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:820px;
    height:150px;

    border-radius:45px;

    background:
    linear-gradient(
        to bottom,
        white,
        #f2f2f2
    );

    border:12px solid #ff43b0;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

    transition:.5s;
}

/* trackpad */

#trackpad{
    position:absolute;
    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    width:180px;
    height:40px;

    border-radius:30px;

    background:
    linear-gradient(
        to bottom,
        #ff7ed2,
        #ff2fa5
    );

    box-shadow:
    0 0 20px #ff9de2;
}

/* OFF MODE */

.offScreen{
    opacity:0;
    pointer-events:none;
}

video{
    width:100%;
    border-radius:15px;
}

</style>
</head>

<body>

<script>

/* FLOWERS */

for(let i=0;i<35;i++){

    const flower=document.createElement("div");

    flower.className="flower";

    flower.style.left=
    Math.random()*window.innerWidth+"px";

    flower.style.top=
    Math.random()*window.innerHeight+"px";

    const size=
    70+Math.random()*100;

    flower.style.width=size+"px";
    flower.style.height=size+"px";

    flower.style.animationDuration=
    (6+Math.random()*6)+"s";

    const center=document.createElement("span");

    flower.appendChild(center);

    document.body.appendChild(flower);
}

/* SPARKLES */

for(let i=0;i<150;i++){

    const sparkle=document.createElement("div");

    sparkle.className="sparkle";

    sparkle.style.left=
    Math.random()*window.innerWidth+"px";

    sparkle.style.top=
    Math.random()*window.innerHeight+"px";

    sparkle.style.animationDuration=
    (1+Math.random()*3)+"s";

    document.body.appendChild(sparkle);
}

</script>

<!-- COMPUTER -->

<div id="computer">

    <div id="shell"></div>

    <div id="logo">
        iBook Dream
    </div>

    <!-- POWER BUTTON -->

    <div id="powerButton"
    onclick="toggleComputer()">
    ⏻
    </div>

    <!-- SCREEN -->

    <div id="screen">

        <div id="desktop">

            <!-- ICONS -->

            <div class="desktopIcon"
            style="top:20px;left:20px;"
            onclick="openWindow('mario')">

                <img src="https://cdn-icons-png.flaticon.com/512/188/188987.png">

                <div>Mario</div>

            </div>

            <div class="desktopIcon"
            style="top:20px;left:130px;"
            onclick="openWindow('winx')">

                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">

                <div>Winx</div>

            </div>

            <div class="desktopIcon"
            style="top:20px;left:240px;"
            onclick="openWindow('bratz')">

                <img src="https://cdn-icons-png.flaticon.com/512/892/892458.png">

                <div>Bratz</div>

            </div>

            <div class="desktopIcon"
            style="top:20px;left:350px;"
            onclick="openWindow('music')">

                <img src="https://cdn-icons-png.flaticon.com/512/727/727245.png">

                <div>Music</div>

            </div>

            <!-- MARIO WINDOW -->

            <div class="window" id="mario">

                <div class="topbar">

                    Super Mario

                    <button class="close"
                    onclick="closeWindow('mario')">
                    ✕
                    </button>

                </div>

                <div class="content">

                    <h2>🍄 Mario World 🍄</h2>

                    <p>
                    Welcome to the Y2K Mario desktop!!
                    </p>

                    <img
                    src="https://upload.wikimedia.org/wikipedia/en/a/a9/MarioNSMBUDeluxe.png"
                    width="220">

                </div>

            </div>

            <!-- WINX -->

            <div class="window" id="winx">

                <div class="topbar">

                    Winx Club

                    <button class="close"
                    onclick="closeWindow('winx')">
                    ✕
                    </button>

                </div>

                <div class="content">

                    <h2>✨ Winx Club ✨</h2>

                    <p>
                    Magical fairy Y2K vibes!!
                    </p>

                    <img
                    src="https://i.imgur.com/JR6Y6be.png"
                    width="250">

                </div>

            </div>

            <!-- BRATZ -->

            <div class="window" id="bratz">

                <div class="topbar">

                    Bratz

                    <button class="close"
                    onclick="closeWindow('bratz')">
                    ✕
                    </button>

                </div>

                <div class="content">

                    <h2>💖 Bratz Fashion 💖</h2>

                    <p>
                    Pink fashion doll aesthetic.
                    </p>

                    <img
                    src="https://i.imgur.com/K4XxA0K.png"
                    width="220">

                </div>

            </div>

            <!-- MUSIC -->

            <div class="window" id="music">

                <div class="topbar">

                    Music

                    <button class="close"
                    onclick="closeWindow('music')">
                    ✕
                    </button>

                </div>

                <div class="content">

                    <h2>🎵 2000s Playlist 🎵</h2>

                    <p>
                    Britney Spears • Cascada • Avril Lavigne
                    </p>

                    <video controls>

                        <source
                        src="https://www.w3schools.com/html/mov_bbb.mp4"
                        type="video/mp4">

                    </video>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- KEYBOARD -->

<div id="base">

    <div id="trackpad"></div>

</div>

<script>

let computerOn=true;

/* POWER BUTTON */

function toggleComputer(){

    computerOn=!computerOn;

    const screen=
    document.getElementById("screen");

    const base=
    document.getElementById("base");

    if(computerOn){

        screen.classList.remove("offScreen");
        base.classList.remove("offScreen");

    }else{

        screen.classList.add("offScreen");
        base.classList.add("offScreen");
    }
}

/* OPEN WINDOWS */

function openWindow(id){

    if(!computerOn) return;

    document
    .getElementById(id)
    .style.display="block";
}

/* CLOSE WINDOWS */

function closeWindow(id){

    document
    .getElementById(id)
    .style.display="none";
}

</script>

</body>
</html>

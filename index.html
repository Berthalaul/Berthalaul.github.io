<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K Dream Laptop</title>

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Verdana,sans-serif;

    background:
    linear-gradient(
        135deg,
        #8fd7ff,
        #ffd1ec
    );
}

/* ===== FLOWERS ===== */

.flower{
    position:absolute;
    width:140px;
    pointer-events:none;
    z-index:1;

    animation:float 8s infinite ease-in-out;
}

.flower img{
    width:100%;
    filter:
    drop-shadow(0 0 15px white)
    drop-shadow(0 0 25px #ff9de2);
}

@keyframes float{

    0%{
        transform:
        translateY(0px)
        rotate(0deg);
    }

    50%{
        transform:
        translateY(-30px)
        rotate(8deg);
    }

    100%{
        transform:
        translateY(0px)
        rotate(0deg);
    }
}

/* ===== COMPUTER ===== */

#computer{
    position:relative;
    width:1050px;
    height:760px;
    z-index:10;
}

/* shell */

#shell{
    position:absolute;
    inset:0;

    border-radius:50px;

    background:
    linear-gradient(
        to bottom,
        #ffffff,
        #f1f1f1
    );

    border:14px solid #ff4fb5;

    box-shadow:
    0 0 60px #ffb6ea,
    0 0 120px #8fd7ff;
}

/* logo */

#logo{
    position:absolute;
    top:18px;
    left:50%;

    transform:translateX(-50%);

    font-size:36px;
    font-weight:bold;

    color:#777;
}

/* power */

#powerButton{
    position:absolute;

    top:18px;
    right:24px;

    width:42px;
    height:42px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ff7ed2,
        #ff2fa5
    );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
    0 0 20px #ff9de2;
}

/* ===== SCREEN ===== */

#screen{
    position:absolute;

    top:80px;
    left:70px;

    width:900px;
    height:500px;

    overflow:hidden;

    border-radius:25px;

    border:10px solid #ddd;

    background:
    linear-gradient(
        135deg,
        #8fd7ff,
        #ffd0ef
    );
}

/* desktop */

#desktop{
    position:relative;
    width:100%;
    height:100%;
}

/* ===== ICONS ===== */

.desktopIcon{
    position:absolute;

    width:120px;

    text-align:center;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.desktopIcon img{

    width:90px;
    height:90px;

    object-fit:cover;

    border-radius:22px;

    padding:8px;

    background:white;

    box-shadow:
    0 0 20px white,
    0 0 30px #ffb6ea;

    transition:.3s;
}

.desktopIcon:hover img{

    transform:
    scale(1.1)
    rotate(5deg);
}

/* ===== WINDOWS ===== */

.window{
    position:absolute;

    top:40px;
    left:45px;

    width:810px;
    height:400px;

    border-radius:22px;

    background:white;

    overflow:hidden;

    display:none;

    box-shadow:
    0 0 40px rgba(0,0,0,.35);
}

/* topbar */

.topbar{
    height:50px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    color:white;
    font-weight:bold;

    background:
    linear-gradient(
        to right,
        #ff7ed2,
        #ffb6ea
    );
}

/* close */

.close{
    width:34px;
    height:34px;

    border:none;

    border-radius:50%;

    background:white;

    color:#ff2fa5;

    cursor:pointer;

    font-weight:bold;
}

/* iframe */

iframe{
    width:100%;
    height:calc(100% - 50px);
    border:none;
}

/* ===== KEYBOARD ===== */

#base{
    position:absolute;

    bottom:0;

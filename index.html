<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K Dream Laptop</title>

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Verdana,sans-serif;

    background:
    linear-gradient(
        135deg,
        #ffb6dc,
        #8fd7ff
    );
}

/* ===== SPARKLY FLOWER BACKGROUND ===== */

.bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
    url('/mnt/data/-4.jpg');
    background-size:cover;
    background-position:center;
    filter:brightness(1.1);
}

.sparkle{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;

    box-shadow:
    0 0 10px white,
    0 0 20px #ff9de2,
    0 0 40px white;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{

    from{
        transform:scale(.5);
        opacity:.4;
    }

    to{
        transform:scale(1.8);
        opacity:1;
    }
}

/* ===== COMPUTER ===== */

#computer{
    position:relative;
    width:1050px;
    height:760px;
    z-index:10;
}

#shell{
    position:absolute;
    inset:0;

    border-radius:50px;

    background:
    linear-gradient(
        to bottom,
        #ffffff,
        #f1f1f1
    );

    border:14px solid #ff4fb5;

    box-shadow:
    0 0 60px #ffb6ea,
    0 0 120px #8fd7ff;
}

#logo{
    position:absolute;
    top:18px;
    left:50%;

    transform:translateX(-50%);

    font-size:36px;
    font-weight:bold;
    color:#777;
}

#powerButton{
    position:absolute;

    top:18px;
    right:24px;

    width:42px;
    height:42px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ff7ed2,
        #ff2fa5
    );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
    0 0 20px #ff9de2;
}

/* ===== SCREEN ===== */

#screen{
    position:absolute;

    top:80px;
    left:70px;

    width:900px;
    height:500px;

    overflow:hidden;

    border-radius:25px;

    border:10px solid #ddd;

    background:
    url('/mnt/data/-4.jpg');

    background-size:cover;
    background-position:center;
}

#desktop{
    position:relative;
    width:100%;
    height:100%;
}

/* ===== ICONS ===== */

.desktopIcon{
    position:absolute;
    width:120px;
    text-align:center;
    cursor:pointer;
}

.desktopIcon img{

    width:90px;
    height:90px;

    object-fit:contain;

    border-radius:24px;

    padding:8px;

    background:white;

    box-shadow:
    0 0 20px white,
    0 0 30px #ffb6ea;

    transition:.3s;
}

.desktopIcon:hover img{

    transform:
    scale(1.1)
    rotate(5deg);
}

/* ===== WINDOWS ===== */

.window{
    position:absolute;

    top:40px;
    left:45px;

    width:810px;
    height:400px;

    border-radius:22px;

    background:white;

    overflow:hidden;

    display:none;

    box-shadow:
    0 0 40px rgba(0,0,0,.35);
}

.topbar{
    height:50px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    color:white;
    font-weight:bold;

    background:
    linear-gradient(
        to right,
        #ff7ed2,
        #ffb6ea
    );
}

.close{
    width:34px;
    height:34px;

    border:none;

    border-radius:50%;

    background:white;

    color:#ff2fa5;

    cursor:pointer;

    font-weight:bold;
}

iframe{
    width:100%;
    height:calc(100% - 50px);
    border:none;
}

/* ===== KEYBOARD ===== */

#base{
    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:1100px;
    height:170px;

    border-radius:45px;

    background:
    linear-gradient(
        to bottom,
        #ffffff,
        #f0f0f0
    );

    border:14px solid #ff4fb5;

    box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}

#trackpad{
    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    width:220px;
    height:45px;

    border-radius:40px;

    background:
    linear-gradient(
        to bottom,
        #ff7ed2,
        #ff2fa5
    );
}

.off{
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- ===== SPARKLES ===== -->

<script>

for(let i=0;i<120;i++){

    const sparkle=document.createElement("div");

    sparkle.className="sparkle";

    sparkle.style.left=
    Math.random()*window.innerWidth+"px";

    sparkle.style.top=
    Math.random()*window.innerHeight+"px";

    sparkle.style.animationDuration=
    (1+Math.random()*3)+"s";

    document.body.appendChild(sparkle);
}

</script>

<!-- ===== COMPUTER ===== -->

<div id="computer">

<div id="shell"></div>

<div id="logo">
iBook Dream
</div>

<div id="powerButton"
onclick="toggleComputer()">
⏻
</div>

<!-- ===== SCREEN ===== -->

<div id="screen">

<div id="desktop">

<!-- ===== APP ICONS ===== -->

<!-- MARIO -->

<div class="desktopIcon"
style="top:30px;left:35px;"
onclick="openWindow('mario')">

<img
src="https://upload.wikimedia.org/wikipedia/en/a/a9/MarioNSMBUDeluxe.png">

</div>

<!-- WINX -->

<div class="desktopIcon"
style="top:30px;left:210px;"
onclick="openWindow('winx')">

<img
src="https://i.imgur.com/0R6b6sS.png">

</div>

<!-- BRATZ -->

<div class="desktopIcon"
style="top:30px;left:385px;"
onclick="openWindow('bratz')">

<img
src="https://i.imgur.com/Y4KpQeb.png">

</div>

<!-- MUSIC -->

<div class="desktopIcon"
style="top:30px;left:560px;"
onclick="openWindow('music')">

<img
src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png">

</div>

<!-- HELLO KITTY -->

<div class="desktopIcon"
style="top:30px;left:735px;"
onclick="openWindow('kitty')">

<img
src="https://i.imgur.com/Jp0n9xV.png">

</div>

<!-- ===== WINDOWS ===== -->

<!-- MARIO -->

<div class="window" id="mario">

<div class="topbar">

🍄 SUPER MARIO 🍄

<button class="close"
onclick="closeWindow('mario')">
✕
</button>

</div>

<iframe
src="https://arcadespot.com/game/super-mario-world-online/">
</iframe>

</div>

<!-- WINX -->

<div class="window" id="winx">

<div class="topbar">

✨ WINX CLUB ✨

<button class="close"
onclick="closeWindow('winx')">
✕
</button>

</div>

<iframe
src="https://www.numuki.com/game/winx-club-love-and-pet/">
</iframe>

</div>

<!-- BRATZ -->

<div class="window" id="bratz">

<div class="topbar">

💖 BRATZ WORLD 💖

<button class="close"
onclick="closeWindow('bratz')">
✕
</button>

</div>

<iframe
src="https://www.numuki.com/games/bratz/">
</iframe>

</div>

<!-- MUSIC -->

<div class="window" id="music">

<div class="topbar">

🎵 Y2K MUSIC 🎵

<button class="close"
onclick="closeWindow('music')">
✕
</button>

</div>

<iframe
src="https://www.youtube.com/embed/4fndeDfaWCg">
</iframe>

</div>

<!-- HELLO KITTY -->

<div class="window" id="kitty">

<div class="topbar">

🎀 HELLO KITTY 🎀

<button class="close"
onclick="closeWindow('kitty')">
✕
</button>

</div>

<iframe
src="https://www.numuki.com/games/hello-kitty/">
</iframe>

</div>

</div>

</div>

<!-- ===== KEYBOARD ===== -->

<div id="base">
<div id="trackpad"></div>
</div>

</div>

<script>

let computerOn=true;

function toggleComputer(){

computerOn=!computerOn;

const screen=
document.getElementById("screen");

if(computerOn){

screen.classList.remove("off");

}else{

screen.classList.add("off");
}
}

function openWindow(id){

if(!computerOn) return;

document
.getElementById(id)
.style.display="block";
}

function closeWindow(id){

document
.getElementById(id)
.style.display="none";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Computer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Verdana,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#ffcce9,#c6d8ff,#ffe7fa);
    position:relative;
}

/* BACKGROUND SPARKLES */

.sparkle{
    position:absolute;
    color:white;
    animation:twinkle 2s infinite ease-in-out;
    pointer-events:none;
}

@keyframes twinkle{
    0%,100%{
        opacity:.3;
        transform:scale(.6);
    }
    50%{
        opacity:1;
        transform:scale(1.3);
    }
}

/* COMPUTER */

.computer{
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-10px);
    }
}

/* MONITOR */

.monitor{
    width:900px;
    height:560px;
    background:linear-gradient(145deg,#d9c2ff,#ffc9ea);
    border-radius:30px;
    padding:22px;
    position:relative;

    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.6),
    0 30px 60px rgba(0,0,0,0.2);
}

/* SCREEN */

.screen{
    width:100%;
    height:100%;
    background:linear-gradient(to bottom,#c8f2ff,#ffd6f2);
    border-radius:18px;
    overflow:hidden;
    position

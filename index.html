<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K Dream Desktop</title>

<style>

/* =========================
BASE
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Verdana;
}

body{
  height:100vh;
  overflow:hidden;
  background: linear-gradient(135deg,#ff9ad5,#ffc6ea,#c0a6ff);
}

/* sparkle texture */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size:6px 6px;
  opacity:.25;
}

/* =========================
FLOWERS (COMBINED STYLE)
========================= */

.flower{
  position:absolute;
  width:160px;
  height:160px;
  animation:float 7s ease-in-out infinite;
  filter:drop-shadow(0 0 12px white);
}

.petal{
  position:absolute;
  width:65px;
  height:65px;
  background: radial-gradient(circle,#fff,#ffbde6);
  border-radius:50%;
}

.center{
  position:absolute;
  width:38px;
  height:38px;
  background:#ff6fcf;
  border-radius:50%;
  left:60px;
  top:60px;
  box-shadow:0 0 12px white;
}

.p1{top:0;left:50px;}
.p2{bottom:0;left:50px;}
.p3{left:0;top:50px;}
.p4{right:0;top:50px;}

@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-15px);}
}

/* flower positions */
.f1{top:40px;left:50px;}
.f2{bottom:60px;right:60px;}
.f3{top:160px;right:180px;}
.f4{bottom:140px;left:120px;}
.f5{top:300px;left:40px;}

/* =========================
COMPUTER
========================= */

.computer{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.monitor{
  width:720px;
  height:520px;
  background: linear-gradient(145deg,#ffb6ea,#caa7ff);
  border-radius:35px;
  padding:18px;
  box-shadow:0 40px 80px rgba(0,0,0,.25);
}

.screen{
  width:100%;
  height:100%;
  border-radius:22px;
  background: linear-gradient(135deg,#9fe7ff,#cbb8ff,#ffd1ee);
  padding:18px;
}

/* top bar */
.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  color:white;
  font-weight:bold;
  font-size:13px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.red{background:#ff7aa5;}
.blue{background:#7ad0ff;}
.yellow{background:#fff27a;}

.title{
  margin-left:10px;
}

/* =========================
DESKTOP ICONS (OLD STYLE)
========================= */

.desktop{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.icon{
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.icon:hover{
  transform:scale(1.08);
}

.icon-box{
  width:78px;
  height:78px;
  margin:auto;
  border-radius:14px;
  background: linear-gradient(#fff,#dcdcdc);
  border:2px solid #b8b8b8;
  box-shadow:
    inset 0 0 8px rgba(255,255,255,.8),
    0 8px 15px rgba(0,0,0,.2);
  position:relative;
}

/* ICON LETTER STYLE (2000s feel) */

.icon-box.winx::before{
  content:"W";
  position:absolute;
  top:20px;
  left:30px;
  font-weight:bold;
  color:#ff4fc3;
}

.icon-box.bratz::before{
  content:"B";
  position:absolute;
  top:20px;
  left:30px;
  font-weight:bold;
  color:#7c4dff;
}

.icon-box.mario::before{
  content:"M";
  position:absolute;
  top:20px;
  left:30px;
  font-weight:bold;
  color:#ff2e2e;
}

.icon-box.switch::before{
  content:"S";
  position:absolute;
  top:20px;
  left:30px;
  font-weight:bold;
  color:#111;
}

/* labels */
.icon span{
  font-size:12px;
  color:white;
  text-shadow:0 0 10px white;
}

/* switch panel */
.switchPanel{
  margin-top:20px;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,.25);
  color:white;
  font-size:12px;
}

</style>
</head>

<body>

<!-- FLOWERS -->
<div class="flower f1">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<div class="flower f2">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<div class="flower f3">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<div class="flower f4">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<div class="flower f5">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<!-- COMPUTER -->
<div class="computer">
  <div class="monitor">
    <div class="screen">

      <div class="topbar">
        <div class="dot red"></div>
        <div class="dot blue"></div>
        <div class="dot yellow"></div>
        <div class="title">Y2K Desktop System</div>
      </div>

      <div class="desktop">

        <div class="icon" onclick="go('https://www.numuki.com/games/winx-club/')">
          <div class="icon-box winx"></div>
          <span>Winx</span>
        </div>

        <div class="icon" onclick="go('https://www.numuki.com/games/bratz/')">
          <div class="icon-box bratz"></div>
          <span>Bratz</span>
        </div>

        <div class="icon" onclick="go('https://supermario-game.com/')">
          <div class="icon-box mario"></div>
          <span>Mario</span>
        </div>

        <div class="icon" onclick="go('https://www.nintendo.com/switch/')">
          <div class="icon-box switch"></div>
          <span>Switch</span>
        </div>

      </div>

      <div class="switchPanel">
        🎮 Nintendo Switch System Online • Y2K Desktop Running Smooth
      </div>

    </div>
  </div>
</div>

<script>
function go(url){
  window.open(url,"_blank");
}
</script>

</body>
</html>

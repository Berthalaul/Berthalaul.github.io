<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y2K Dream Laptop</title>

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    font-family:Verdana,sans-serif;

    background:
    linear-gradient(
        135deg,
        #c7ecff,
        #ffd7ef,
        #fff0f8
    );
}

/* ===== COMPUTER ===== */

#computer{
    position:absolute;
    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    width:1050px;
    height:800px;

    z-index:100;
}

/* shell */

#shell{
    position:absolute;
    inset:0;

    border-radius:55px;

    background:
    linear-gradient(
        to bottom,
        white,
        #f4f4f4
    );

    border:14px solid #ff43b0;

    box-shadow:
    0 0 70px #ffb6ea,
    0 0 140px #8fd7ff;
}

/* logo */

#logo{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    font-size:38px;
    font-weight:bold;
    color:#666;
}

/* power button */

#powerButton{
    position:absolute;

    top:20px;
    right:25px;

    width:42px;
    height:42px;

    border-radius:50%;

    background:
    linear-gradient(
        to bottom,
        #ff7ed2,
        #ff2fa5
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
    0 0 20px #ffb6ea,
    0 0 40px #8fd7ff;

    transition:.3s;
}

#powerButton:hover{
    transform:scale(1.1);
}

/* ===== SCREEN ===== */

#screen{
    position:absolute;

    top:85px;
    left:65px;

    width:900px;
    height:520px;

    border-radius:25px;

    border:10px solid #ddd;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #ffbfe5,
        #ff93d2,
        #c7ecff
    );

    box-shadow:
    inset 0 0 50px white;

    transition:.5s;
}

/* desktop */

#desktop{
    width:100%;
    height:100%;
    position:relative;
}

/* ===== ICONS ===== */

.desktopIcon{
    width:130px;
    position:absolute;

    text-align:center;

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.desktopIcon img{

    width:92px;
    height:92px;

    object-fit:contain;

    padding:10px;

    border-radius:24px;

    box-shadow:
    0 0 20px white,
    0 0 30px #ffb6ea;

    transition:.3s;
}

.desktopIcon:hover img{

    transform:
    scale(1.1)
    rotate(5deg);
}

/* ===== WINDOWS ===== */

.window{
    position:absolute;

    top:50px;
    left:60px;

    width:780px;
    height:400px;

    border-radius:25px;

    background:white;

    display:none;

    overflow:hidden;

    box-shadow:
    0 0 50px rgba(0,0,0,.35);

    animation:pop .3s ease;
}

@keyframes pop{

    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

/* topbar */

.topbar{
    height:52px;

    background:
    linear-gradient(
        to right,
        #ff7ed2,
        #ffb7e8
    );

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    color:white;

    font-weight:bold;
}

/* close */

.close{
    background:white;
    color:#ff43b0;

    border:none;

    width:34px;
    height:34px;

    border-radius:50%;

    cursor:pointer;

    font-weight:bold;
}

/* iframe */

iframe{
    width:100%;
    height:calc(100% - 52px);
    border:none;
}

/* ===== KEYBOARD ===== */

#base{
    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:1100px;
    height:180px;

    border-radius:50px;

    background:
    linear-gradient(
        to bottom,
        white,
        #f2f2f2
    );

    border:14px solid #ff43b0;

    box-shadow:
    0 20px 60px rgba(0,0,0,.25);

    transition:.5s;
}

/* trackpad */

#trackpad{
    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    width:220px;
    height:45px;

    border-radius:40px;

    background:
    linear-gradient(
        to bottom,
        #ff7ed2,
        #ff2fa5
    );

    box-shadow:
    0 0 25px #ff9de2;
}

/* off */

.offScreen{
    opacity:0;
    pointer-events:none;
}

</style>
</head>

<body>

<!-- ===== COMPUTER ===== -->

<div id="computer">

    <div id="shell"></div>

    <div id="logo">
        iBook Dream
    </div>

    <!-- POWER -->

    <div id="powerButton"
    onclick="toggleComputer()">
    ⏻
    </div>

    <!-- ===== SCREEN ===== -->

    <div id="screen">

        <div id="desktop">

            <!-- ===== APPS ===== -->

            <!-- MARIO -->

            <div class="desktopIcon"
            style="top:40px;left:50px;"
            onclick="openWindow('mario')">

                <img
                src="https://upload.wikimedia.org/wikipedia/en/0/03/Super_Mario_Bros._Logo.svg"
                style="
                background:
                linear-gradient(
                to bottom,
                #ff2f2f,
                #ff9d00
                );
                ">

                <div>Mario</div>

            </div>

            <!-- WINX -->

            <div class="desktopIcon"
            style="top:40px;left:240px;"
            onclick="openWindow('winx')">

                <img
                src="https://upload.wikimedia.org/wikipedia/en/f/fb/Winx_Club_logo.png"
                style="
                background:
                linear-gradient(
                to bottom,
                #ff9de8,
                #9c7dff
                );
                ">

                <div>Winx</div>

            </div>

            <!-- BRATZ -->

            <div class="desktopIcon"
            style="top:40px;left:430px;"
            onclick="openWindow('bratz')">

                <img
                src="https://upload.wikimedia.org/wikipedia/commons/6/69/Bratz_logo.svg"
                style="
                background:
                linear-gradient(
                to bottom,
                #ff5db5,
                #ffc7ea
                );
                ">

                <div>Bratz</div>

            </div>

            <!-- MUSIC -->

            <div class="desktopIcon"
            style="top:40px;left:620px;"
            onclick="openWindow('music')">

                <img
                src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png"
                style="
                background:
                linear-gradient(
                to bottom,
                #8fd7ff,
                #7d7cff
                );
                ">

                <div>Music</div>

            </div>

            <!-- ===== WINDOWS ===== -->

            <!-- MARIO -->

            <div class="window" id="mario">

                <div class="topbar">

                    🍄 SUPER MARIO WORLD 🍄

                    <button class="close"
                    onclick="closeWindow('mario')">
                    ✕
                    </button>

                </div>

                <iframe
                src="https://supermario-game.com">
                </iframe>

            </div>

            <!-- WINX -->

            <div class="window" id="winx">

                <div class="topbar">

                    ✨ WINX MAGIC CLUB ✨

                    <button class="close"
                    onclick="closeWindow('winx')">
                    ✕
                    </button>

                </div>

                <iframe
                src="https://www.numuki.com/game/winx-club-bloomix-battle/">
                </iframe>

            </div>

            <!-- BRATZ -->

            <div class="window" id="bratz">

                <div class="topbar">

                    💖 BRATZ FASHION WORLD 💖

                    <button class="close"
                    onclick="closeWindow('bratz')">
                    ✕
                    </button>

                </div>

                <iframe
                src="https://www.numuki.com/games/bratz/">
                </iframe>

            </div>

            <!-- MUSIC -->

            <div class="window" id="music">

                <div class="topbar">

                    🎵 Y2K MUSIC PLAYER 🎵

                    <button class="close"
                    onclick="closeWindow('music')">
                    ✕
                    </button>

                </div>

                <iframe
                src="https://www.youtube.com/embed/P13M4K1xuDo">
                </iframe>

            </div>

        </div>

    </div>

</div>

<!-- ===== KEYBOARD ===== -->

<div id="base">

    <div id="trackpad"></div>

</div>

<script>

let computerOn=true;

/* power */

function toggleComputer(){

    computerOn=!computerOn;

    const screen=
    document.getElementById("screen");

    const base=
    document.getElementById("base");

    if(computerOn){

        screen.classList.remove("offScreen");
        base.classList.remove("offScreen");

    }else{

        screen.classList.add("offScreen");
        base.classList.add("offScreen");
    }
}

/* open windows */

function openWindow(id){

    if(!computerOn) return;

    document
    .getElementById(id)
    .style.display="block";
}

/* close windows */

function closeWindow(id){

    document
    .getElementById(id)
    .style.display="none";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Y2K Dream Computer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Trebuchet MS",sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(135deg,#c7f2ff,#ffd3f0,#d7c5ff);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:url('https://cur.cursors-4u.net/cursors/cur-9/cur817.cur'),auto;
}

/* SPARKLES */

.sparkle{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    box-shadow:
        0 0 10px white,
        0 0 20px #fff,
        0 0 30px #ffb6ff;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        transform:scale(0.5);
        opacity:0.4;
    }
    50%{
        transform:scale(2);
        opacity:1;
    }
}

/* FLOWERS */

.flower{
    position:absolute;
    font-size:40px;
    animation:floatFlower 8s infinite ease-in-out;
    filter:drop-shadow(0 0 10px #fff);
}

@keyframes floatFlower{
    0%,100%{
        transform:translateY(0px) rotate(0deg);
    }
    50%{
        transform:translateY(-20px) rotate(10deg);
    }
}

/* COMPUTER */

.computer{
    position:relative;
    animation:floatPC 5s infinite ease-in-out;
}

@keyframes floatPC{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
}

/* MONITOR */

.monitor{
    width:760px;
    height:500px;
    background:#f2d6ff;
    border:18px solid #d6d6ff;
    border-radius:25px;
    box-shadow:
        0 0 50px rgba(255,255,255,0.9),
        inset 0 0 20px rgba(255,255,255,0.7);
    position:relative;
    overflow:hidden;
}

/* SCREEN */

.screen{
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(255,255,255,0.08),rgba(255,255,255,0.08)),
    linear-gradient(135deg,#ffb3ec,#ffc8f3,#ffdbfa);
    position:relative;
    overflow:hidden;
}

/* CRT EFFECT */

.screen::after{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 2px,
        rgba(0,0,0,0.02) 4px
    );
    pointer-events:none;
}

/* TOP BAR */

.topbar{
    height:38px;
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    padding:0 14px;
    color:#ff1493;
    font-weight:bold;
    border-bottom:2px solid rgba(255,255,255,0.4);
    text-shadow:0 0 8px white;
}

/* DESKTOP */

.desktop{
    padding:25px;
    display:grid;
    grid-template-columns:repeat(3,140px);
    justify-content:center;
    gap:28px 60px;
}

/* ICONS */

.icon{
    width:140px;
    text-align:center;
    color:#ff1493;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
    user-select:none;
}

.icon:hover{
    transform:scale(1.1);
    filter:brightness(1.1);
}

.icon:active{
    transform:scale(0.95);
}

.icon .emoji{
    font-size:58px;
    margin-bottom:8px;
    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 15px pink);
}

/* STAND */

.stand{
    width:180px;
    height:35px;
    background:#d7d7ff;
    margin:auto;
    border-radius:0 0 20px 20px;
}

.base{
    width:300px;
    height:35px;
    background:#cfcfff;
    margin:10px auto;
    border-radius:20px;
}

/* POWER BUTTON */

.power{
    position:absolute;
    bottom:18px;
    right:22px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#8affc7;
    box-shadow:
      0 0 10px #8affc7,
      0 0 20px #8affc7;
    cursor:pointer;
    transition:0.3s;
}

.power.off{
    background:#666;
    box-shadow:none;
}

/* SHUTDOWN SCREEN */

.shutdown{
    position:absolute;
    inset:0;
    background:black;
    color:white;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:42px;
    z-index:20;
    letter-spacing:3px;
}

.shutdown small{
    font-size:18px;
    margin-top:20px;
    color:#aaa;
}

/* MARQUEE */

.marquee{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(255,255,255,0.45);
    color:#ff1493;
    padding:7px;
    font-weight:bold;
    overflow:hidden;
    white-space:nowrap;
}

.marquee span{
    display:inline-block;
    padding-left:100%;
    animation:scroll 18s linear infinite;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

/* RESPONSIVE */

@media(max-width:850px){

    .computer{
        transform:scale(0.62);
    }

    .desktop{
        grid-template-columns:repeat(2,140px);
    }

}

/* FLOWERS POSITIONS */

.f1{top:5%;left:8%;}
.f2{top:70%;left:12%;}
.f3{top:20%;right:10%;}
.f4{bottom:10%;right:15%;}
.f5{top:40%;left:2%;}
.f6{top:8%;right:25%;}

</style>
</head>

<body>

<!-- FLOWERS -->

<div class="flower f1">🌸</div>
<div class="flower f2">🌼</div>
<div class="flower f3">🌺</div>
<div class="flower f4">🌷</div>
<div class="flower f5">✨</div>
<div class="flower f6">💖</div>

<!-- COMPUTER -->

<div class="computer">

<div class="monitor">

<!-- OFF SCREEN -->

<div class="shutdown" id="shutdownScreen">
    COMPUTER OFF
    <small>Press power button to turn on</small>
</div>

<!-- SCREEN -->

<div class="screen" id="screen">

<div class="topbar">
💖 Y2K DREAM DESKTOP 💖
</div>

<!-- DESKTOP ICONS -->

<div class="desktop">

    <!-- MUSIC -->

    <div class="icon"
    onclick="openSite('https://www.youtube.com/watch?v=QHazKnA0UWY&list=PLxA687tYuMWi8OUus77n7aP8BvH6g0K4T')">

        <div class="emoji">🎵</div>

        Y2K Music

    </div>

    <!-- HELLO KITTY -->

    <div class="icon"
    onclick="openSite('https://www.numuki.com/games/hello-kitty/')">

        <div class="emoji">🐱</div>

        Hello Kitty

    </div>

    <!-- WINX -->

    <div class="icon"
    onclick="openSite('https://games.winxclub.com/31/Game.html?languageId=1')">

        <div class="emoji">🧚</div>

        Winx Game

    </div>

    <!-- MARIO -->

    <div class="icon"
    onclick="openSite('https://supermario-game.com/')">

        <div class="emoji">🍄</div>

        Mario

    </div>

    <!-- BRATZ -->

    <div class="icon"
    onclick="openSite('https://bratz.fandom.com/wiki/Category:Video_Games')">

        <div class="emoji">💋</div>

        Bratz

    </div>

    <!-- Y2K WEB -->

    <div class="icon"
    onclick="openSite('https://www.cameronsworld.net/')">

        <div class="emoji">💿</div>

        Y2K Web

    </div>

</div>

<!-- MARQUEE -->

<div class="marquee">
<span>
✨ welcome to the y2k dream desktop ✨ glitter girls forever ✨ fairycore internet ✨ myspace vibes ✨ 2000s nostalgia ✨
</span>
</div>

</div>

<!-- POWER BUTTON -->

<div class="power" id="powerBtn"></div>

</div>

<div class="stand"></div>
<div class="base"></div>

</div>

<!-- AUDIO -->

<audio id="clickSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
</audio>

<!-- SPARKLES SCRIPT -->

<script>

for(let i=0;i<80;i++){

    const s=document.createElement('div');

    s.className='sparkle';

    s.style.left=Math.random()*100+'vw';
    s.style.top=Math.random()*100+'vh';

    s.style.animationDelay=Math.random()*4+'s';

    s.style.opacity=Math.random();

    document.body.appendChild(s);
}

/* OPEN WEBSITE */

function openSite(url){

    if(!isOn) return;

    document.getElementById('clickSound').play();

    window.open(url,'_blank');
}

/* POWER BUTTON */

const powerBtn=document.getElementById('powerBtn');

const screen=document.getElementById('screen');

const shutdown=document.getElementById('shutdownScreen');

let isOn=true;

powerBtn.addEventListener('click',()=>{

    isOn=!isOn;

    if(isOn){

        powerBtn.classList.remove('off');

        screen.style.display='block';

        shutdown.style.display='none';

    }else{

        powerBtn.classList.add('off');

        screen.style.display='none';

        shutdown.style.display='flex';
    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2000s Computer Zone 2</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Verdana, sans-serif;
    }

    body{
        background: linear-gradient(to bottom, #b7ecff, #dff7ff);
        overflow:hidden;
        height:100vh;
    }

    /* Floating sparkles */
    .sparkle{
        position:absolute;
        width:8px;
        height:8px;
        background:white;
        border-radius:50%;
        opacity:0.7;
        animation: float 6s infinite linear;
    }

    @keyframes float{
        from{
            transform:translateY(100vh) scale(0.5);
        }
        to{
            transform:translateY(-100px) scale(1.2);
        }
    }

    /* Purple dreamy area */
    .purple-glow{
        position:absolute;
        width:700px;
        height:700px;
        background: radial-gradient(circle, rgba(180,0,255,0.35), transparent 70%);
        bottom:-250px;
        right:-150px;
        pointer-events:none;
    }

    /* Computer */
    .computer{
        position:relative;
        width:900px;
        height:620px;
        margin:40px auto;
    }
    .monitor{
        background:#d7d7d7;
        border:12px solid #999;
        border-radius:25px;
        width:100%;
        height:500px;
        box-shadow:
            inset 0 0 20px rgba(255,255,255,0.7),
            0 15px 30px rgba(0,0,0,0.3);
        position:relative;
    }

    .screen{
        position:absolute;
        top:20px;
        left:20px;
        right:20px;
        bottom:20px;
        background: linear-gradient(to bottom, #bff4ff, #ffd6ff);
        border-radius:10px;
        overflow:auto;
        padding:20px;
    }

    .stand{
        width:200px;
        height:30px;
        background:#999;
        margin:0 auto;
        border-radius:0 0 20px 20px;
    }

    .base{
        width:320px;
        height:25px;
        background:#777;
        margin:0 auto;
        border-radius:20px;
    }

    h1{
        text-align:center;
        color:#8b1fd8;
        text-shadow:2px 2px white;
        margin-bottom:20px;
        font-size:38px;
    }

    .icons{
        display:grid;
        grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
        gap:20px;
    }

    .icon{
        text-align:center;
        cursor:pointer;
        transition:0.2s;
    }

    .icon:hover{
        transform:scale(1.1) rotate(-2deg);
    }

    .icon img{
        width:80px;
        height:80px;
        border-radius:18px;
        border:3px solid white;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
        object-fit:cover;
    }

    .icon span{
        display:block;
        margin-top:8px;
        color:#5d007d;
        font-weight:bold;
        font-size:14px;
    }

    .footer{
        position:absolute;
        bottom:10px;
        width:100%;
        text-align:center;
        color:#7a2ea8;
        font-size:14px;
    }

    /* Scrollbar */
    .screen::-webkit-scrollbar{
        width:10px;
    }

    .screen::-webkit-scrollbar-thumb{
        background:#c66dff;
        border-radius:20px;
    }

</style>
</head>
<body>

<div class="purple-glow"></div>

<!-- Sparkles -->
<script>
for(let i=0;i<40;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(3+Math.random()*6)+"s";
    s.style.opacity=Math.random();
    document.body.appendChild(s);
}
</script>

<div class="computer">

    <div class="monitor">
        <div class="screen">

            <h1>✨ 2000's Computer ✨</h1>

            <div class="icons">

                <div class="icon" onclick="openGame('https://playclassic.games/games/action-dos-games-online/play-grand-theft-auto-2-online/')">
                    <img src="https://upload.wikimedia.org/wikipedia/en/7/73/Grand_Theft_Auto_2_Game_Cover.jpg">
                    <span>GTA 2</span>
                </div>

                <div class="icon" onclick="openGame('https://supermario-game.com')">
                    <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/MarioNSMBUDeluxe.png">
                    <span>Super Mario</span>
                </div>

                <div class="icon" onclick="openGame('https://www.numuki.com/games/winx-club/')">
                    <img src="https://upload.wikimedia.org/wikipedia/en/8/8d/Winx_Club_logo.png">
                    <span>Winx Club</span>
                </div>

                <div class="icon" onclick="openGame('https://www.numuki.com/games/bratz/')">
                    <img src="https://upload.wikimedia.org/wikipedia/en/e/e4/Bratz_Logo.png">
                    <span>Bratz Dolls</span>
                </div>

                <div class="icon" onclick="openGame('https://archive.org/details/softwarelibrary_msdos_games')">
                    <img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">
                    <span>Retro Games</span>
                </div>

                <div class="icon" onclick="openGame('https://classicreload.com')">
                    <img src="https://cdn-icons-png.flaticon.com/512/686/686589.png">
                    <span>Classic Reload</span>
                </div>

                <div class="icon" onclick="openGame('https://archive.org/details/classicpcgames')">
                    <img src="https://cdn-icons-png.flaticon.com/512/3022/3022256.png">
                    <span>PC Classics</span>
                </div>

                <div class="icon" onclick="openGame('https://www.retrogames.cc')">
                    <img src="https://cdn-icons-png.flaticon.com/512/3145/3145765.png">
                    <span>Retro Console</span>
                </div>

            </div>

        </div>
    </div>

    <div class="stand"></div>
    <div class="base"></div>

</div>

<div class="footer">
    💜 Welcome to the Y2K Purple Place 💜
</div>

<script>
function openGame(url){
    window.open(url, "_blank");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Y2K Dream Computer</title>

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    font-family:Verdana,sans-serif;

    background:
    linear-gradient(
        135deg,
        #c6ebff,
        #ffd7ef,
        #fff0f8
    );
}

/* ===== FLOWERS ===== */

.flower{
    position:absolute;
    width:120px;
    height:120px;
    animation:float 8s infinite ease-in-out;
    z-index:1;
}

.flower::before,
.flower::after{
    content:"";
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        white 0%,
        #ffb6e8 45%,
        #ff4ebf 80%
    );
}

.flower::before{
    transform:rotate(45deg) scale(.65);
}

.flower::after{
    transform:rotate(-45deg) scale(.65);
}

.flower span{
    position:absolute;
    width:30px;
    height:30px;
    border-radius:50%;
    background:white;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    box-shadow:
    0 0 15px white,
    0 0 30px #ff99dd;
}

@keyframes float{

    0%{
        transform:
        translateY(0px)
        rotate(0deg);
    }

    50%{
        transform:
        translateY(-40px)
        rotate(15deg);
    }

    100%{
        transform:
        translateY(0px)
        rotate(0deg);
    }
}

/* ===== SPARKLES ===== */

.sparkle{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;

    animation:twinkle 2s infinite alternate;

    box-shadow:
    0 0 10px white,
    0 0 20px #ffb6ea,
    0 0 30px #8fd7ff;
}

@keyframes twinkle{

    from{
        transform:scale(.5);
        opacity:.3;
    }

    to{
        transform:scale(2);
        opacity:1;
    }
}

/* ===== COMPUTER ===== */

#computer{
    position:absolute;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    width:650px;
    height:520px;

    z-index:100;
}

/* shell */

#shell{
    position:absolute;
    inset:0;

    border-radius:45px;

    background:
    linear-gradient(
        to bottom,
        white,
        #f2f2f2
    );

    border:10px solid #ff3faf;

    box-shadow:
    0 0 50px #ffb6ea,
    0 0 100px #8fd7ff;
}

/* title */

#logo{
    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    font-size:28px;
    font-weight:bold;

    color:#666;
}

/* screen */

#screen{
    position:absolute;

    top:70px;
    left:70px;

    width:510px;
    height:290px;

    background:
    linear-gradient(
        135deg,
        #ffc6ea,
        #ff9ed8
    );

    border:8px solid #ddd;
    border-radius:10px;

    overflow:hidden;

    box-shadow:
    inset 0 0 30px white;
}

/* fake desktop */

#desktop{
    width:100%;
    height:100%;
    position:relative;
}

/* apps */

.window{
    position:absolute;

    inset:0;

    display:none;

    padding:20px;

    color:white;

    overflow:auto;

    background:
    linear-gradient(
        135deg,
        #ff8fd8,
        #ffb6ea
    );
}

/* close */

.close{
    position:absolute;
    top:10px;
    right:10px;

    background:white;
    color:#ff3faf;

    border:none;

    border-radius:20px;

    padding:8px 14px;

    cursor:pointer;

    font-weight:bold;
}

/* icons */

.icons{
    position:absolute;

    bottom:40px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:15px;

    z-index:20;
}

.icon{
    width:80px;
    height:80px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:12px;
    font-weight:bold;

    color:#ff3faf;

    cursor:pointer;

    background:
    linear-gradient(
        to bottom,
        white,
        #ffd8ef
    );

    box-shadow:
    0 0 20px white,
    0 0 30px #ffb6ea;

    transition:.3s;
}

.icon:hover{
    transform:
    scale(1.1)
    rotate(5deg);
}

/* keyboard */

#base{
    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:720px;
    height:140px;

    border-radius:40px;

    background:
    linear-gradient(
        to bottom,
        white,
        #f2f2f2
    );

    border:10px solid #ff3faf;

    box-shadow:
    0 20px 50px rgba(0,0,0,.2);
}

/* trackpad */

#trackpad{
    position:absolute;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    width:160px;
    height:35px;

    border-radius:20px;

    background:
    linear-gradient(
        to bottom,
        #ff77cf,
        #ff2fa5
    );
}

h1{
    margin-top:40px;
}

</style>
</head>

<body>

<!-- FLOWERS -->

<script>

for(let i=0;i<35;i++){

    const flower=document.createElement("div");

    flower.className="flower";

    flower.style.left=
    Math.random()*window.innerWidth+"px";

    flower.style.top=
    Math.random()*window.innerHeight+"px";

    const size=
    50+Math.random()*90;

    flower.style.width=size+"px";
    flower.style.height=size+"px";

    const center=document.createElement("span");

    flower.appendChild(center);

    document.body.appendChild(flower);
}

/* sparkles */

for(let i=0;i<120;i++){

    const sparkle=document.createElement("div");

    sparkle.className="sparkle";

    sparkle.style.left=
    Math.random()*window.innerWidth+"px";

    sparkle.style.top=
    Math.random()*window.innerHeight+"px";

    sparkle.style.animationDuration=
    (1+Math.random()*3)+"s";

    document.body.appendChild(sparkle);
}

</script>

<!-- COMPUTER -->

<div id="computer">

    <div id="shell"></div>

    <div id="logo">
        iBook
    </div>

    <!-- SCREEN -->

    <div id="screen">

        <div id="desktop">

            <!-- MARIO -->

            <div class="window" id="mario">

                <button class="close"
                onclick="closeWindow('mario')">
                CLOSE
                </button>

                <h1>🍄 SUPER MARIO WORLD 🍄</h1>

                <p>
                Welcome to the Y2K Mario zone!!
                </p>

                <img
                src="https://upload.wikimedia.org/wikipedia/en/a/a9/MarioNSMBUDeluxe.png"
                width="200">

            </div>

            <!-- WINX -->

            <div class="window" id="winx">

                <button class="close"
                onclick="closeWindow('winx')">
                CLOSE
                </button>

                <h1>✨ WINX CLUB ✨</h1>

                <p>
                Magical fairy desktop !!
                </p>

            </div>

            <!-- BRATZ -->

            <div class="window" id="bratz">

                <button class="close"
                onclick="closeWindow('bratz')">
                CLOSE
                </button>

                <h1>💖 BRATZ WORLD 💖</h1>

                <p>
                Fashion dolls + pink Y2K vibes.
                </p>

            </div>

            <!-- MUSIC -->

            <div class="window" id="music">

                <button class="close"
                onclick="closeWindow('music')">
                CLOSE
                </button>

                <h1>🎵 2000s MUSIC 🎵</h1>

                <p>
                Britney Spears • Avril Lavigne • Cascada
                </p>

            </div>

        </div>

    </div>

    <!-- ICONS -->

    <div class="icons">

        <div class="icon"
        onclick="openWindow('mario')">
        Mario
        </div>

        <div class="icon"
        onclick="openWindow('winx')">
        Winx
        </div>

        <div class="icon"
        onclick="openWindow('bratz')">
        Bratz
        </div>

        <div class="icon"
        onclick="openWindow('music')">
        Music
        </div>

    </div>

</div>

<!-- keyboard -->

<div id="base">
    <div id="trackpad"></div>
</div>

<script>

function openWindow(id){

    document
    .getElementById(id)
    .style.display="block";
}

function closeWindow(id){

    document
    .getElementById(id)
    .style.display="none";
}

</script>

</body>
</html>

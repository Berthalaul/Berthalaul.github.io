<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y2K Dream Computer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Verdana;
}

body{
  height:100vh;
  overflow:hidden;
  background: linear-gradient(135deg,#ff9ad5,#ffc6ea,#bda7ff);
}

/* sparkles background */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size:6px 6px;
  opacity:.25;
}

/* FLOWERS (lightweight) */
.flower{
  position:absolute;
  width:130px;
  height:130px;
  animation:float 6s ease-in-out infinite;
  filter:drop-shadow(0 0 10px white);
}

.petal{
  position:absolute;
  width:55px;
  height:55px;
  background: radial-gradient(circle,#fff,#ffbde6);
  border-radius:50%;
}

.center{
  position:absolute;
  width:30px;
  height:30px;
  background:#ff6fcf;
  border-radius:50%;
  left:50px;
  top:50px;
  box-shadow:0 0 10px white;
}

.p1{top:0;left:40px;}
.p2{bottom:0;left:40px;}
.p3{left:0;top:40px;}
.p4{right:0;top:40px;}

@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-12px);}
}

/* COMPUTER */
.computer{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.monitor{
  width:700px;
  height:500px;
  background: linear-gradient(145deg,#ffb6ea,#caa7ff);
  border-radius:35px;
  padding:20px;
  box-shadow:0 35px 70px rgba(0,0,0,.25);
}

.screen{
  width:100%;
  height:100%;
  border-radius:22px;
  background: linear-gradient(135deg,#9fe7ff,#cbb8ff,#ffd1ee);
  padding:18px;
  overflow:hidden;
}

/* top bar */
.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  color:white;
  font-size:13px;
  font-weight:bold;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.red{background:#ff7aa5;}
.blue{background:#7ad0ff;}
.yellow{background:#fff27a;}

.title{
  margin-left:10px;
}

/* icons */
.icons{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.app{
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.app:hover{
  transform:scale(1.1);
}

.icon{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:18px;
  background:rgba(255,255,255,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.app span{
  font-size:12px;
  color:white;
  text-shadow:0 0 10px white;
}

/* flower positions */
.f1{top:40px;left:40px;}
.f2{bottom:60px;right:70px;}
.f3{top:180px;right:200px;}
</style>
</head>

<body>

<!-- FLOWERS -->
<div class="flower f1">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<div class="flower f2">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<div class="flower f3">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>
  <div class="petal p4"></div>
  <div class="center"></div>
</div>

<!-- COMPUTER -->
<div class="computer">
  <div class="monitor">
    <div class="screen">

      <div class="topbar">
        <div class="dot red"></div>
        <div class="dot blue"></div>
        <div class="dot yellow"></div>
        <div class="title">Y2K Desktop.exe</div>
      </div>

      <div class="icons">

        <div class="app" onclick="go('https://www.numuki.com/games/winx-club/')">
          <div class="icon">🧚</div>
          <span>Winx</span>
        </div>

        <div class="app" onclick="go('https://www.numuki.com/games/bratz/')">
          <div class="icon">💄</div>
          <span>Bratz</span>
        </div>

        <div class="app" onclick="go('https://supermario-game.com/')">
          <div class="icon">🍄</div>
          <span>Mario</span>
        </div>

        <div class="app" onclick="go('https://www.crazygames.com/')">
          <div class="icon">🎮</div>
          <span>Arcade</span>
        </div>

        <div class="app" onclick="go('https://www.girlsgogames.com/')">
          <div class="icon">💖</div>
          <span>Dress Up</span>
        </div>

        <div class="app" onclick="go('https://www.youtube.com/')">
          <div class="icon">🎵</div>
          <span>Music</span>
        </div>

        <div class="app" onclick="go('https://www.youtube.com/watch?v=dQw4w9WgXcQ')">
          <div class="icon">🎧</div>
          <span>2000s Hits</span>
        </div>

        <div class="app" onclick="go('https://www.roblox.com/')">
          <div class="icon">🎲</div>
          <span>Games</span>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
function go(url){
  window.open(url,"_blank");
}
</script>

</body>
</html>

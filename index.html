<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretty Y2K Background</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    position:relative;
    background:
    linear-gradient(
    135deg,
    #ff98cb,
    #ffb6dd,
    #ff9fce
    );
}

/* soft glitter texture */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(
    rgba(255,255,255,.18) 1px,
    transparent 1px);

    background-size:5px 5px;

    opacity:.4;
}

/* dreamy glow */

.glow{

    position:absolute;

    width:700px;
    height:700px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(255,255,255,.18),
    transparent 70%);

    filter:blur(80px);

    animation:moveGlow 12s infinite alternate ease-in-out;
}

.glow1{
    top:-200px;
    left:-150px;
}

.glow2{
    bottom:-250px;
    right:-200px;
}

@keyframes moveGlow{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(40px,-20px);
    }
}

/* =========================================
BIG Y2K FLOWERS
========================================= */

.flower{

    position:absolute;

    width:220px;
    height:220px;

    animation:
    float 8s infinite ease-in-out;

    transition:.3s;

}

/* petals */

.petal{

    position:absolute;

    width:95px;
    height:95px;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,.95),
    rgba(255,220,240,.75));

    border-radius:50% 50% 50% 0;

    box-shadow:
    0 0 15px rgba(255,255,255,.7);

}

/* petal positions */

.p1{
    left:62px;
    top:0;
    transform:rotate(45deg);
}

.p2{
    right:0;
    top:62px;
    transform:rotate(135deg);
}

.p3{
    left:62px;
    bottom:0;
    transform:rotate(225deg);
}

.p4{
    left:0;
    top:62px;
    transform:rotate(315deg);
}

/* center */

.center{

    position:absolute;

    width:70px;
    height:70px;

    left:75px;
    top:75px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    white,
    #ff9fd4);

    box-shadow:
    0 0 20px white,
    0 0 40px #ffd6ee;
}

/* hover sparkle */

.flower.active{

    filter:
    drop-shadow(0 0 20px white)
    drop-shadow(0 0 40px #ffd6ee);

    transform:scale(1.08);
}

/* =========================================
SPARKLES
========================================= */

.sparkle{

    position:absolute;

    color:white;

    font-size:18px;

    pointer-events:none;

    opacity:.7;

    animation:
    twinkle 2s infinite alternate;

    text-shadow:
    0 0 10px white,
    0 0 20px white;
}

@keyframes twinkle{

    from{
        transform:scale(.7);
        opacity:.4;
    }

    to{
        transform:scale(1.3);
        opacity:1;
    }
}

/* =========================================
SWIRLS
========================================= */

.swirl{

    position:absolute;

    border:3px solid rgba(255,255,255,.7);

    border-color:white transparent transparent transparent;

    border-radius:50%;

    opacity:.75;
}

/* =========================================
ANIMATION
========================================= */

@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }
}

</style>
</head>
<body>

<!-- glowing background -->
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<!-- swirls -->
<div class="swirl"
style="
width:700px;
height:700px;
left:-250px;
top:-250px;
"></div>

<div class="swirl"
style="
width:550px;
height:550px;
right:-180px;
bottom:-180px;
"></div>

<!-- flowers -->
<div class="flower"
style="
top:40px;
right:40px;
transform:scale(1.1);
">

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="center"></div>

</div>

<div class="flower"
style="
bottom:20px;
right:180px;
transform:scale(.9);
">

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="center"></div>

</div>

<div class="flower"
style="
top:160px;
right:220px;
transform:scale(.7);
opacity:.7;
">

    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="center"></div>

</div>

<!-- sparkles -->

<script>

/* lightweight sparkles */

for(let i=0;i<40;i++){

    const sparkle =
    document.createElement("div");

    sparkle.classList.add("sparkle");

    sparkle.innerHTML = "✦";

    sparkle.style.left =
    Math.random()*100+"vw";

    sparkle.style.top =
    Math.random()*100+"vh";

    sparkle.style.fontSize =
    (8 + Math.random()*16)+"px";

    sparkle.style.animationDelay =
    Math.random()*2+"s";

    document.body.appendChild(sparkle);
}

/* click glow */

document.addEventListener("click",(e)=>{

    const flowers =
    document.querySelectorAll(".flower");

    flowers.forEach(flower=>{

        const rect =
        flower.getBoundingClientRect();

        const fx =
        rect.left + rect.width/2;

        const fy =
        rect.top + rect.height/2;

        const distance =
        Math.hypot(
            e.clientX - fx,
            e.clientY - fy
        );

        if(distance < 300){

            flower.classList.add("active");

            setTimeout(()=>{
                flower.classList.remove("active");
            },500);
        }
    });
});

</script>

</body>
</html>

.glow1{

}

.glow2{
    bottom:-250px;
    right:-200px;
}

/* ======================================
FLOWERS
====================================== */

.flower{
    position:absolute;
    width:220px;

    animation:float 7s ease-in-out infinite;
    transition:.3s;
}

/* petals */

.petal{
    position:absolute;

    width:95px;
    height:95px;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,.95),

}

}

.p2{
    right:0;

    left:62px;

.p4{
    left:0;
    top:62px;
    transform:rotate(315deg);
}

/* center */

    position:absolute;

    width:70px;
    height:70px;

    left:75px;
    top:75px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    white,
    #ff9fd4);

    box-shadow:
    0 0 20px white,
    0 0 40px #ffd6ee;
}

/* flower glow */

.flower.active{

    filter:
    drop-shadow(0 0 20px white)
    drop-shadow(0 0 40px #ffd6ee);

    transform:scale(1.08);
}

/* ======================================
SWIRLS
====================================== */

.swirl{
    position:absolute;

    border:3px solid rgba(255,255,255,.7);

    border-color:white transparent transparent transparent;

    border-radius:50%;
}

/* ======================================
COMPUTER
====================================== */

.computer{
    position:absolute;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);
}

/* monitor */

.monitor{

    width:650px;
    height:480px;

    border-radius:40px;

    padding:25px;

    position:relative;

    background:
    linear-gradient(
    145deg,
    #ffc6ea,
    #cb9dff,
    #9c88ff
    );

    box-shadow:
    inset -10px -10px 25px rgba(255,255,255,.4),
    inset 10px 10px 25px rgba(0,0,0,.12),
    0 35px 70px rgba(0,0,0,.25);
}

/* monitor shine */

.monitor::before{
    content:"";
    position:absolute;

    width:220px;
    height:80px;

    border-radius:50px;

    top:15px;
    left:25px;

    background:
    rgba(255,255,255,.25);

    transform:rotate(-10deg);
}

/* power button */

.power{
    position:absolute;

    width:20px;
    height:20px;

    border-radius:50%;

    background:white;

    bottom:40px;
    left:30px;

    box-shadow:
    0 0 10px white;
}

/* floppy drive */

.drive{
    position:absolute;

    width:90px;
    height:12px;

    border-radius:4px;

    background:#5a397f;

    bottom:45px;
    right:35px;
}

/* screen */

.screen{

    width:100%;
    height:100%;

    border-radius:28px;

    overflow:hidden;

    position:relative;

    background:
    linear-gradient(
    135deg,
    #8fd9ff,
    #a7b4ff,
    #ffc5ea
    );
}

/* crt effect */

.screen::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.05),
    rgba(255,255,255,.05) 2px,
    transparent 2px,
    transparent 4px);

    opacity:.4;
}

/* desktop */

.desktop{
    position:absolute;
    inset:0;
    padding:20px;
}

/* top bar */

.topbar{

    height:38px;

    border-radius:14px;

    background:
    rgba(255,255,255,.25);

    display:flex;
    align-items:center;

    padding:0 14px;

    color:white;

    backdrop-filter:blur(10px);
}

/* dots */

.dots{
    display:flex;
    gap:6px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
}

.pink{
    background:#ff7dcf;
}

.blue{
    background:#7ecfff;
}

.white{
    background:white;
}

/* title */

.title{
    margin-left:14px;
    font-size:14px;
}

/* welcome */

.welcome{

    text-align:center;

    margin-top:24px;

    color:white;

    font-size:34px;

    font-weight:bold;

    text-shadow:
    0 0 10px white,
    0 0 20px #ff9ee1,
    0 0 40px #ff9ee1;
}

/* icons */

.icons{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:28px;

    margin-top:35px;
}

.icon{
    text-align:center;
}

.icon a{
    text-decoration:none;
    color:white;
}

.icon-box{

    width:85px;
    height:85px;

    margin:auto;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;

    background:
    linear-gradient(
    to bottom,
    rgba(255,255,255,.7),
    rgba(255,255,255,.18));

    border:1px solid rgba(255,255,255,.6);

    box-shadow:
    0 10px 20px rgba(0,0,0,.15),
    inset 0 0 15px rgba(255,255,255,.5);

    transition:.2s;
}

.icon:hover .icon-box{

    transform:scale(1.08);

    box-shadow:
    0 0 20px white,
    0 0 35px #ffd6ee;
}

.icon span{

    display:block;

    margin-top:8px;

    font-size:12px;

    text-shadow:
    0 0 10px rgba(255,255,255,.8);
}

/* stand */

.stand{

    width:160px;
    height:35px;

    margin:auto;

    background:
    linear-gradient(
    to bottom,
    #f4c4ec,
    #9f73dc);

    border-radius:0 0 18px 18px;
}

/* base */

.base{

    width:260px;
    height:28px;

    margin:8px auto 0;

    border-radius:20px;

    background:
    linear-gradient(
    to bottom,
    #ffd2ef,
    #a073e2);
}

/* keyboard */

.keyboard{

    width:720px;

    margin:28px auto 0;

    padding:18px;

    border-radius:26px;

    background:
    linear-gradient(
    145deg,
    #ffc5ea,
    #c69cff);

    transform:
    perspective(1000px)
    rotateX(18deg);
}

.keys{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:8px;

.key{

    height:32px;

<script>

/* keyboard */

const keys =
document.getElementById("keys");

for(let i=0;i<60;i++){

    const key =
    document.createElement("div");

    key.classList.add("key");

    keys.appendChild(key);
}

/* sparkles */

for(let i=0;i<40;i++){

    const sparkle =
    document.createElement("div");

    sparkle.classList.add("sparkle");

    sparkle.innerHTML = "✦";

    sparkle.style.left =
    Math.random()*100+"vw";

    sparkle.style.top =
    Math.random()*100+"vh";

    sparkle.style.fontSize =
    (8 + Math.random()*16)+"px";

    sparkle.style.animationDelay =
    Math.random()*2+"s";

    document.body.appendChild(sparkle);
}

/* click flower glow */

document.addEventListener("click",(e)=>{

    const flowers =
    document.querySelectorAll(".flower");

    flowers.forEach(flower=>{

        const rect =
        flower.getBoundingClientRect();

        const fx =
        rect.left + rect.width/2;

        const fy =
        rect.top + rect.height/2;

        const distance =
        Math.hypot(
        e.clientX - fx,
        e.clientY - fy
        );

        if(distance < 300){

            flower.classList.add("active");

            setTimeout(()=>{
                flower.classList.remove("active");
            },500);
        }
    });
});

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Y2K Dream World</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #bfe9ff, #ffd1dc);
    }

    /* Toggle button */
    #toggle {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 1000;
        padding: 10px 15px;
        border: none;
        border-radius: 20px;
        background: white;
        cursor: pointer;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    /* Floating flowers */
    .flower {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff, #ff9de2, #8fd3ff);
        box-shadow: 0 0 15px #fff, 0 0 25px #ffb3ec;
        animation: float 6s infinite ease-in-out, sparkle 2s infinite alternate;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
    }

    @keyframes sparkle {
        0% { filter: brightness(1); }
        100% { filter: brightness(1.8); }
    }

    /* Computer hub */
    #computer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 220px;
        background: #222;
        border-radius: 12px;
        box-shadow: 0 0 30px #fff, 0 0 60px #ffb3ec;
        padding: 15px;
        color: white;
        text-align: center;
    }

    #screen {
        background: #111;
        height: 120px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #8fd3ff;
    }

    .icons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .icon {
        background: #333;
        padding: 8px;
        border-radius: 8px;
        font-size: 11px;
        cursor: pointer;
        transition: 0.2s;
    }

    .icon:hover {
        background: #555;
        transform: scale(1.05);
    }

    .disabled {
        animation: none !important;
        filter: none !important;
    }
</style>
</head>

<body>

<button id="toggle">Turn OFF ✨</button>

<!-- Computer -->
<div id="computer">
    <div id="screen">Y2K Desktop ✨</div>

    <div class="icons">
        <div class="icon" onclick="window.open('https://supermario.nintendo.com/', '_blank')">
            Super Mario
        </div>

        <div class="icon" onclick="window.open('https://winxclub.com/', '_blank')">
            Winx Club
        </div>

        <div class="icon" onclick="window.open('https://bratz.com/', '_blank')">
            Bratz
        </div>

        <div class="icon" onclick="window.open('https://www.youtube.com/watch?v=2vjPBrBU-TM', '_blank')">
            2000s Music
        </div>

        <div class="icon" onclick="document.getElementById('piano').style.display='block'">
            Play Piano
        </div>
    </div>
</div>

<!-- Simple Piano -->
<div id="piano" style="
    display:none;
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 20px #0003;
">
    <div onclick="play(261.6)" style="display:inline-block;width:40px;height:120px;background:white;border:1px solid black;"></div>
    <div onclick="play(293.7)" style="display:inline-block;width:40px;height:120px;background:white;border:1px solid black;"></div>
    <div onclick="play(329.6)" style="display:inline-block;width:40px;height:120px;background:white;border:1px solid black;"></div>
    <div onclick="play(349.2)" style="display:inline-block;width:40px;height:120px;background:white;border:1px solid black;"></div>
    <button onclick="document.getElementById('piano').style.display='none'">Close</button>
</div>

<script>
let soundOn = true;

/* Create flowers */
for (let i = 0; i < 25; i++) {
    let f = document.createElement("div");
    f.className = "flower";
    f.style.left = Math.random() * window.innerWidth + "px";
    f.style.top = Math.random() * window.innerHeight + "px";
    f.style.width = (20 + Math.random() * 60) + "px";
    f.style.height = f.style.width;
    document.body.appendChild(f);
}

/* Toggle */
document.getElementById("toggle").onclick = () => {
    soundOn = !soundOn;
    document.querySelectorAll(".flower").forEach(f => {
        f.style.animation = soundOn ? "float 6s infinite ease-in-out, sparkle 2s infinite alternate" : "none";
    });

    document.getElementById("toggle").innerText =
        soundOn ? "Turn OFF ✨" : "Turn ON ✨";
};

/* Simple piano sound */
function play(freq) {
    if (!soundOn) return;
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();

    osc.frequency.value = freq;
    osc.type = "sine";

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);

    osc.start();
    osc.stop(ctx.currentTime + 1);
}
</script>

</body>
</html>

    radial-gradient(circle at 80% 50%,
    #ffd1ef,
    transparent 20%),

    radial-gradient(circle at 50% 80%,
    #ff7dd1,
    transparent 20%);
}

/* iframe */

#iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    z-index:10;
    background:white;
    display:none;
}

/* icons */

.icons{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:20;
}

.icon{
    width:80px;
    height:80px;

    background:
    linear-gradient(
        to bottom,
        white,
        #ffd1ef
    );

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    font-size:12px;
    font-weight:bold;

    color:#ff3faf;

    cursor:pointer;

    box-shadow:
    0 0 15px white,
    0 0 20px #ffb6ea;

    transition:.3s;
}

.icon:hover{
    transform:
    scale(1.1)
    rotate(5deg);
}

/* keyboard */

#base{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);

    width:720px;
    height:140px;

    background:
    linear-gradient(
        to bottom,
        white,
        #f2f2f2
    );

    border:10px solid #ff3faf;
    border-radius:40px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.2);
}

/* trackpad */

#trackpad{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);

    width:160px;
    height:35px;

    border-radius:20px;

    background:
    linear-gradient(
        to bottom,
        #ff77cf,
        #ff2fa5
    );

    box-shadow:
    0 0 20px #ff9de2;
}

/* close button */

#closeBtn{
    position:absolute;
    top:10px;
    right:10px;

    z-index:999;

    background:white;
    border:none;

    padding:8px 12px;

    border-radius:20px;

    cursor:pointer;

    display:none;

    color:#ff3faf;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- FLOWERS -->
<script>

for(let i=0;i<35;i++){

    const flower=document.createElement("div");
    flower.className="flower";

    flower.style.left=
    Math.random()*window.innerWidth+"px";

    flower.style.top=
    Math.random()*window.innerHeight+"px";

    const size=
    50+Math.random()*90;

    flower.style.width=size+"px";
    flower.style.height=size+"px";

    flower.style.animationDuration=
    (6+Math.random()*8)+"s";

    const center=document.createElement("span");
    flower.appendChild(center);

    document.body.appendChild(flower);
}

/* sparkles */

for(let i=0;i<120;i++){

    const s=document.createElement("div");

    s.className="sparkle";

    s.style.left=
    Math.random()*window.innerWidth+"px";

    s.style.top=
    Math.random()*window.innerHeight+"px";

    s.style.animationDuration=
    (1+Math.random()*3)+"s";

    document.body.appendChild(s);
}

</script>

<!-- COMPUTER -->

<div id="computer">

    <div id="shell"></div>

    <div id="logo">
        iBook
    </div>

    <!-- SCREEN -->

    <div id="screen">

        <button id="closeBtn"
        onclick="closeSite()">
        ✕ Close
        </button>

        <iframe id="iframe"></iframe>

    </div>

    <!-- ICONS -->

    <div class="icons">

        <div class="icon"
        onclick="openSite('https://supermario.nintendo.com/')">
        Mario
        </div>

        <div class="icon"
        onclick="openSite('https://winxclub.com/')">
        Winx
        </div>

        <div class="icon"
        onclick="openSite('https://bratz.com/')">
        Bratz
        </div>

        <div class="icon"
        onclick="openSite('https://www.youtube.com/embed/2vjPBrBU-TM')">
        Music
        </div>

    </div>

</div>

<!-- keyboard -->

<div id="base">
    <div id="trackpad"></div>
</div>

<script>

function openSite(url){

    const frame=document.getElementById("iframe");

    frame.style.display="block";

    frame.src=url;

    document
    .getElementById("closeBtn")
    .style.display="block";
}

function closeSite(){

    const frame=document.getElementById("iframe");

    frame.src="";

    frame.style.display="none";

    document
    .getElementById("closeBtn")
    .style.display="none";
}

</script>

</body>
</html>

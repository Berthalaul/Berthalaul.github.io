<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Y2K Flower Background</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;

    background:
    radial-gradient(circle at top left,
    #ffb7dc 0%,
    transparent 30%),

    radial-gradient(circle at bottom right,
    #ffc7e8 0%,
    transparent 30%),

    linear-gradient(
    135deg,
    #ff8fc6,
    #ffb1da,
    #ff9ccc
    );

    position:relative;
}

/* glitter texture */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(
    rgba(255,255,255,0.22) 1px,
    transparent 1px);

    background-size:5px 5px;

    opacity:.45;

    pointer-events:none;
}

/* dreamy fog */

body::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at center,
    rgba(255,255,255,0.12),
    transparent 70%);

    filter:blur(60px);

    pointer-events:none;
}

/* flowers */

.flower{
    position:absolute;
    color:rgba(255,255,255,0.88);

    text-shadow:
    0 0 15px white,
    0 0 35px #ffd9f1,
    0 0 60px #fff;

    filter:drop-shadow(0 0 25px rgba(255,255,255,.7));

    animation:
    floatFlower linear infinite,
    pulse 3s ease-in-out infinite alternate;
}

/* flower sparkle */

.flower::after{
    content:"✦";
    position:absolute;
    top:-10px;
    right:-10px;

    font-size:28px;

    color:white;

    animation:twinkle 2s infinite alternate;

    text-shadow:
    0 0 10px white,
    0 0 20px white;
}

@keyframes floatFlower{

    from{
        transform:
        translateY(110vh)
        rotate(0deg)
        scale(1);
    }

    to{
        transform:
        translateY(-130vh)
        rotate(360deg)
        scale(1.1);
    }
}

@keyframes pulse{

    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}

@keyframes twinkle{

    from{
        transform:scale(.6);
        opacity:.4;
    }

    to{
        transform:scale(1.4);
        opacity:1;
    }
}

/* glowing vines */

.vine{
    position:absolute;
    border:3px solid rgba(255,255,255,.75);

    border-color:white transparent transparent transparent;

    border-radius:50%;

    filter:
    drop-shadow(0 0 12px white);

    opacity:.8;

    animation:spin linear infinite;
}

/* 3D depth */

.layer1{
    transform:perspective(1000px) rotateX(10deg);
}

.layer2{
    transform:perspective(1000px) rotateX(-8deg);
}

.layer3{
    transform:perspective(1000px) rotateY(12deg);
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* extra sparkles */

.sparkle{
    position:absolute;

    color:white;

    animation:
    sparkleFloat linear infinite,
    twinkle 2s infinite alternate;

    text-shadow:
    0 0 10px white,
    0 0 25px white;
}

@keyframes sparkleFloat{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-100vh);
    }
}

</style>
</head>
<body>

<!-- vines -->
<div class="vine layer1"
style="
width:900px;
height:900px;
top:-300px;
left:-250px;
animation-duration:40s;
"></div>

<div class="vine layer2"
style="
width:700px;
height:700px;
bottom:-250px;
right:-200px;
animation-duration:30s;
"></div>

<div class="vine layer3"
style="
width:600px;
height:600px;
top:120px;
right:-180px;
animation-duration:26s;
"></div>

<script>

/* giant flowers */

const flowers = ["🌸","❀","✿","🌺"];

for(let i=0;i<18;i++){

    const f = document.createElement("div");

    f.classList.add("flower");

    f.innerHTML =
    flowers[Math.floor(Math.random()*flowers.length)];

    f.style.left =
    Math.random()*100+"vw";

    f.style.fontSize =
    (80 + Math.random()*140)+"px";

    f.style.top =
    Math.random()*100+"vh";

    f.style.animationDuration =
    (18 + Math.random()*25)+"s";

    f.style.animationDelay =
    (-Math.random()*20)+"s";

    document.body.appendChild(f);
}

/* sparkles */

for(let i=0;i<120;i++){

    const s = document.createElement("div");

    s.classList.add("sparkle");

    s.innerHTML = "✦";

    s.style.left =
    Math.random()*100+"vw";

    s.style.top =
    Math.random()*100+"vh";

    s.style.fontSize =
    (6 + Math.random()*20)+"px";

    s.style.animationDuration =
    (8 + Math.random()*12)+"s";

    s.style.animationDelay =
    (-Math.random()*20)+"s";

    document.body.appendChild(s);
}

/* mouse glow */

document.addEventListener("mousemove",(e)=>{

    document.body.style.background = `

    radial-gradient(circle at ${e.clientX}px ${e.clientY}px,
    rgba(255,255,255,.16),
    transparent 18%),

    radial-gradient(circle at top left,
    #ffb7dc 0%,
    transparent 30%),

    radial-gradient(circle at bottom right,
    #ffc7e8 0%,
    transparent 30%),

    linear-gradient(
    135deg,
    #ff8fc6,
    #ffb1da,
    #ff9ccc
    )
    `;
});

</script>

</body>
</html>

    50%{
        opacity:1;
    }

    100%{
        transform:
        translateY(-40px)
        scale(1.4);
        opacity:0;
    }
}

/* =========================================
Y2K SWIRLS
========================================= */

.swirl{

    position:absolute;

    border:3px solid rgba(255,255,255,.7);

    border-color:white transparent transparent transparent;

    border-radius:50%;

    opacity:.7;
}

</style>
</head>
<body>

<!-- swirls -->

<div class="swirl"
style="
width:700px;
height:700px;
left:-250px;
top:-250px;
"></div>

<div class="swirl"
style="
width:550px;
height:550px;
right:-180px;
bottom:-180px;
"></div>

<script>

/* =========================================
CREATE FLOWERS
========================================= */

const flowerCount = 8;

for(let i=0;i<flowerCount;i++){

    const flower =
    document.createElement("div");

    flower.classList.add("flower");

    flower.style.left =
    Math.random()*100+"vw";

    flower.style.top =
    Math.random()*100+"vh";

    flower.style.transform =
    `scale(${0.7 + Math.random()*0.8})`;

    /* petals */

    for(let p=1;p<=4;p++){

        const petal =
        document.createElement("div");

        petal.classList.add("petal","p"+p);

        flower.appendChild(petal);
    }

    /* center */

    const center =
    document.createElement("div");

    center.classList.add("center");

    flower.appendChild(center);

    document.body.appendChild(flower);
}

/* =========================================
CLICK SPARKLE EFFECT
========================================= */

document.addEventListener("click",(e)=>{

    /* sparkles */

    for(let i=0;i<12;i++){

        const sparkle =
        document.createElement("div");

        sparkle.classList.add("sparkle");

        sparkle.innerHTML = "✦";

        sparkle.style.left =
        e.clientX + (Math.random()*80-40)+"px";

        sparkle.style.top =
        e.clientY + (Math.random()*80-40)+"px";

        sparkle.style.fontSize =
        (10 + Math.random()*20)+"px";

        document.body.appendChild(sparkle);

        setTimeout(()=>{
            sparkle.remove();
        },800);
    }

    /* nearest flowers glow */

    const flowers =
    document.querySelectorAll(".flower");

    flowers.forEach(flower=>{

        const rect =
        flower.getBoundingClientRect();

        const fx =
        rect.left + rect.width/2;

        const fy =
        rect.top + rect.height/2;

        const distance =
        Math.hypot(
            e.clientX - fx,
            e.clientY - fy
        );

        if(distance < 250){

            flower.classList.add("active");

            setTimeout(()=>{
                flower.classList.remove("active");
            },700);
        }
    });
});

</script>

</body>
